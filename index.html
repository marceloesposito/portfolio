<!DOCTYPE html>
<!-- HEADING -->
<head>
    <link rel="stylesheet" href="css/style.css">
    <title>Portfolio</title>
    <meta charset="utf-8">
</head>

<!-- BODY -->

<body>
    <div class="top-row" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
        <div class="logotype" style="font-family: 'Times New Roman', Times, serif; font-size: 1.5rem; letter-spacing: 0; color: var(--fg-color); margin: 0.75rem 20px 0; align-self: center;">
            mb<span style="font-weight: bold; font-style: italic; background: var(--fg-color); color: var(--bg-color);">md</span>
        </div>
        <div class="control-wrapper">
            <div class="box-label" data-i18n="color controls">colors</div>
            <div class="control-box color-controls" data-label="colors">
                <button id="swapColors" class="color-button" data-i18n="swap colors">swap colors</button>
                <div class="color-preview" id="colorPreview">
                    <span class="color-square fg" aria-hidden="true"></span>
                    <span class="color-hex" id="fgHex">#58c2ff</span>
                    <span class="color-square bg" aria-hidden="true"></span>
                    <span class="color-hex" id="bgHex">#050712</span>
                </div>
                <button id="randomizeColors" class="color-button" data-i18n="randomize colors">randomize colors</button>
                <button id="saveColors" class="color-button" data-i18n="save colors">save colors</button>
            </div>
        </div>

        <div class="control-wrapper">
            <div class="box-label" data-i18n="font controls">fonts</div>
            <div class="control-box font-controls" data-label="fonts">
                <div class="font-box" id="fontBox">
                    <button class="font-toggle" data-font="serif" id="fontSerif" data-i18n="serif">serif</button>
                    <button class="font-toggle" data-font="sans" id="fontSans" data-i18n="sans">sans</button>
                    <button class="font-toggle" data-font="mono" id="fontMono" data-i18n="mono">mono</button>
                </div>
            </div>
        </div>

        <div class="control-wrapper">
            <div class="box-label" data-i18n="language controls">language</div>
            <div class="control-box lang-controls">
                <div class="lang-box" id="langBox">
                    <button class="lang-toggle selected" data-lang="en" id="langEn" data-i18n="english">english</button>
                    <button class="lang-toggle" data-lang="it" id="langIt" data-i18n="italian">italian</button>
                </div>
            </div>
        </div>
    </div>

    <hr style="border: 1px solid var(--fg-color); margin: 1.5rem 0; border-width: 1px 0 0 0;">

    <div class="search-row" style="display:flex;gap:8px;align-items:center;margin-top:8px;margin-bottom:12px;">
        <div class="search-wrap">
            <input id="siteSearch" class="search-input" type="search" placeholder="type here to search" data-i18n="type here to search">
        </div>
        <button id="searchBtn" class="search-btn" type="button" data-i18n="search">Search</button>
    </div>

    <!-- Site navigator + content area: left = pages list, right = content viewer -->
    <div class="site-view" style="margin-top:12px;">
        <div class="nav-and-content" style="display:flex;gap:12px;align-items:stretch;">
            <div class="nav-wrapper">
                <div class="box-label" data-i18n="navigation">navigation</div>
                <div class="nav-box control-box" id="navBox" style="min-width:200px; height:60vh;">
                    <ul class="selectable-list nav-list" id="siteNav">
                        <li><button class="selectable nav-item" data-file="data/home.json" data-i18n="home">home</button></li>
                        <li>
                            <button class="collapsible" data-i18n="portfolio">portfolio</button>
                            <ul class="sub-list">
                                <li><button class="selectable nav-item" data-file="data/projects/project1.json" data-i18n="project 1">project 1</button></li>
                                <li><button class="selectable nav-item" data-file="data/projects/project2.json" data-i18n="project 2">project 2</button></li>
                                <li><button class="selectable nav-item" data-file="data/projects/project3.json" data-i18n="project 3">project 3</button></li>
                            </ul>
                        </li>
                        <li>
                            <button class="collapsible" data-i18n="blog">blog</button>
                            <ul class="sub-list">
                                <li><button class="selectable nav-item" data-file="data/blog/post1.json" data-i18n="post 1">post 1</button></li>
                            </ul>
                        </li>
                        <li><button class="selectable nav-item" data-file="data/rss/feed.json" data-i18n="rss feed">rss feed</button></li>
                    </ul>
                </div>
            </div>

            <div class="content-wrapper">
                <div class="box-label" data-i18n="content">content</div>
                <div class="content-box control-box" id="contentBox" style="height:60vh;width:60vw;">
                    <div id="contentBody" style="width:100%;height:100%;overflow:auto;color:var(--fg-color);font-family:inherit;font-size:1rem;position:relative;">
                        <h2>welcome</h2>
                        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed non risus. Suspendisse lectus tortor, dignissim sit amet, adipiscing nec, ultricies sed, dolor.</p>
                        <div class="content-fade"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <hr style="border: 1px solid var(--fg-color); margin: 1.5rem 0; border-width: 1px 0 0 0;">

    <div class="control-wrapper" style="margin-top:12px;">
        <div class="box-label" data-i18n="music player">music player</div>
        <div class="player-box control-box" id="playerBox">
            <div class="player-left" style="flex:1;">
                <span data-i18n="now playing">now playing</span> - <span id="npAuthor">Author</span>, <em id="npTitle">Song Title</em>
            </div>
            <div class="player-center" style="display:flex;gap:8px;align-items:center;">
                <button id="skipBtn" class="music-btn" data-i18n="skip">skip</button>
                <button id="pauseBtn" class="music-btn" data-i18n="pause">pause</button>
                <button id="playBtn" class="music-btn" data-i18n="play">play</button>
                <button id="muteBtn" class="music-btn" data-i18n="mute">mute</button>
            </div>
            <div class="player-right" style="display:flex;gap:8px;align-items:center;">
                <input id="volumeSlider" type="range" min="0" max="100" value="80" />
                <div id="volumeLabel" data-i18n="volume">volume</div>: <span id="volumePercent">80</span>%
            </div>
            <audio id="audioPlayer" preload="none"></audio>
        </div>
    </div>

<script src="js/main.js"></script>
