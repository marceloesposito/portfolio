<!DOCTYPE html>
<!-- HEADING -->
<head>
    <link rel="stylesheet" href="style.css">
    <title>Portfolio</title>
    <meta charset="utf-8">
</head>

<!-- BODY -->

<body>
    <div class="control-box color-controls">
        <button id="swapColors" class="color-button">Swap background/foreground</button>
        <div class="color-preview" id="colorPreview">
            <span class="color-square fg" aria-hidden="true"></span>
            <span class="color-hex" id="fgHex">#58c2ff</span>
            <span class="color-square bg" aria-hidden="true"></span>
            <span class="color-hex" id="bgHex">#050712</span>
        </div>
        <button id="randomizeColors" class="color-button">Randomize colors</button>
    </div>

    <div class="control-box font-controls">
        <div class="font-box" id="fontBox">
            <button class="font-toggle" data-font="serif" id="fontSerif">Serif</button>
            <button class="font-toggle" data-font="sans" id="fontSans">Sans</button>
            <button class="font-toggle" data-font="mono" id="fontMono">Mono</button>
        </div>
    </div>

        <!-- Search field -->
        <div class="search-wrap">
            <input id="siteSearch" class="search-input" type="search" placeholder="type here to search">
        </div>
        <button id="searchBtn" class="search-btn" type="button">Search</button>

    <div>mbmd</div>
    <div class="box">
        Your text here
    </div>
    
        <!-- Text input (native caret used) -->
        <div class="input-wrap">
                <input id="demoInput" class="text-input" type="text" placeholder="Type here...">
        </div>

        <!-- Square radio buttons (custom box + checkmark) -->
        <form class="radio-group">
            <label><input type="radio" name="choice" class="square-radio" checked><span class="radio-box" aria-hidden="true"></span> Option 1</label>
            <label><input type="radio" name="choice" class="square-radio"><span class="radio-box" aria-hidden="true"></span> Option 2</label>
            <label><input type="radio" name="choice" class="square-radio"><span class="radio-box" aria-hidden="true"></span> Option 3</label>
        </form>

        <!-- Two versions of the selectable list, side-by-side -->
        <div class="lists-row">
            <div class="list-column">
                <h3>Multi-select (click to toggle multiple)</h3>
                <ul class="selectable-list multi-select">
                    <li><button class="selectable">Selectable Item 1</button></li>
                    <li><button class="selectable">Selectable Item 2</button></li>
                    <li><button class="selectable">Selectable Item 3</button></li>
                    <li><button class="selectable">Selectable Item 4</button></li>
                </ul>
            </div>
            <div class="list-column">
                <h3>Single-select (radio style)</h3>
                <ul class="selectable-list single-select">
                    <li><button class="selectable">Selectable Item A</button></li>
                    <li><button class="selectable">Selectable Item B</button></li>
                    <li><button class="selectable">Selectable Item C</button></li>
                    <li><button class="selectable">Selectable Item D</button></li>
                </ul>
            </div>
        </div>
